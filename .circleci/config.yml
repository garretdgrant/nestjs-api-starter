version: 2.1

# Checks only: this starter does not build, push or deploy anything from CI.
# Add deploy jobs per project once it has its own registry and hosting.

executors:
  node-executor:
    docker:
      # Keep in step with .nvmrc and the Dockerfile.
      - image: cimg/node:26.13.0

commands:
  install:
    description: Check out the code and install dependencies from the lockfile
    steps:
      - checkout
      - restore_cache:
          name: Restore dependency cache
          # Bump the version prefix to clear the cache.
          key: pnpm-packages-v2-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm@12.18.0
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-packages-v2-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ./node_modules
      - run:
          name: Generate Prisma client
          command: pnpm run prisma:generate

jobs:
  lint:
    executor: node-executor
    steps:
      - install
      - run:
          name: Check formatting
          command: pnpm run format:check
      - run:
          name: Lint
          command: pnpm run lint
      - run:
          name: Typecheck
          command: pnpm run typecheck

  test:
    executor: node-executor
    steps:
      - install
      - run:
          name: Unit tests with coverage
          command: pnpm run test:cov
      - run:
          name: End-to-end tests
          command: pnpm run test:e2e

  build:
    executor: node-executor
    steps:
      - install
      - run:
          name: Build
          command: pnpm run build

workflows:
  ci:
    jobs:
      - lint
      - test
      - build
